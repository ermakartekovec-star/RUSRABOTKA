<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>Центр уведомлений 🔔</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 30% 20%, #1e2b3c, #0b1219);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .notification-hub {
      background: rgba(20, 28, 45, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 48px;
      box-shadow: 0 35px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      padding: 35px 30px;
      max-width: 520px;
      width: 100%;
      color: #eef5ff;
      transition: all 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .bell-icon {
      font-size: 3.8rem;
      filter: drop-shadow(0 8px 15px #f5b042);
      background: rgba(255, 215, 0, 0.1);
      border-radius: 50%;
      padding: 10px;
      line-height: 1;
    }

    h1 {
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: 1px;
      background: linear-gradient(to right, #f9e076, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .permission-card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      padding: 22px 20px;
      margin: 20px 0 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .permission-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .indicator {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6b7280;
      box-shadow: 0 0 10px currentColor;
      transition: all 0.3s;
    }

    .indicator.granted {
      background: #2dd4bf;
      box-shadow: 0 0 18px #2dd4bf;
    }
    .indicator.denied {
      background: #f87171;
      box-shadow: 0 0 18px #f87171;
    }
    .indicator.prompt {
      background: #fbbf24;
      box-shadow: 0 0 18px #fbbf24;
    }

    .permission-text {
      font-weight: 500;
      font-size: 1.1rem;
      color: #ccdbe9;
    }

    .request-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      font-size: 0.95rem;
      background: #334155;
      letter-spacing: 0.5px;
    }

    .request-btn:hover:not(:disabled) {
      background: #475569;
      border-color: #facc15;
      transform: scale(1.02);
    }

    .request-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .composer {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 24px;
      padding: 22px 18px;
      margin: 20px 0;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      background: rgba(10, 15, 27, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 14px 18px;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
      resize: vertical;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
    }

    .row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .row .field {
      flex: 1 1 45%;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 25px;
    }

    .primary-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      padding: 16px 25px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 15px 28px rgba(245, 158, 11, 0.45);
      transition: all 0.2s;
      letter-spacing: 0.8px;
      border: 1px solid #fcd34d;
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 14px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #94a3b8;
    }

    .auto-send-area {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 30px;
      padding: 10px 18px;
      flex-wrap: wrap;
    }

    .auto-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b9c7dd;
    }

    select, .interval-select {
      background: #1e293b;
      color: white;
      border: 1px solid #475569;
      padding: 8px 15px;
      border-radius: 25px;
      font-weight: 500;
      cursor: pointer;
    }

    .log {
      margin-top: 25px;
      background: #0b1019;
      border-radius: 22px;
      padding: 12px 16px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: #a0b3d9;
      border: 1px solid #2d3a52;
    }

    .log-entry {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .hidden {
      display: none;
    }

    button:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="notification-hub">
    <div class="header">
      <span class="bell-icon">🔔</span>
      <h1>Уведомления</h1>
    </div>

    <!-- Статус разрешения -->
    <div class="permission-card">
      <div class="permission-status">
        <span class="indicator" id="permissionIndicator"></span>
        <span class="permission-text" id="permissionLabel">Проверка...</span>
      </div>
      <button class="request-btn" id="requestPermissionBtn">📨 Запросить доступ</button>
    </div>

    <!-- Форма уведомления -->
    <div class="composer">
      <div class="field">
        <label>📌 Заголовок</label>
        <input type="text" id="notifTitle" placeholder="Привет! 🎉" value="Новое уведомление">
      </div>
      <div class="field">
        <label>💬 Текст сообщения</label>
        <textarea id="notifBody" rows="3" placeholder="Это тестовое уведомление...">Демонстрация работы Notification API. Нажмите, чтобы открыть страницу.</textarea>
      </div>
      <div class="row">
        <div class="field">
          <label>🖼️ Иконка (URL)</label>
          <input type="url" id="notifIcon" placeholder="https://example.com/icon.png" value="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23fbbf24'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white'%3E🔔%3C/text%3E%3C/svg%3E">
        </div>
        <div class="field">
          <label>🏷️ Тег (группировка)</label>
          <input type="text" id="notifTag" placeholder="greeting" value="demo-notification">
        </div>
      </div>
    </div>

    <!-- Кнопки действий -->
    <div class="action-buttons">
      <button class="primary-btn" id="sendNowBtn">
        <span>📤</span> Отправить сейчас
      </button>
      <button class="secondary-btn" id="scheduleOnceBtn">
        <span>⏱️</span> Отправить через 5 секунд
      </button>
    </div>

    <!-- Автоматическая отправка -->
    <div class="auto-send-area">
      <span class="auto-label">🔄 Авто-отправка каждые</span>
      <select id="intervalSelect" class="interval-select">
        <option value="0">Выключено</option>
        <option value="8">8 сек</option>
        <option value="15" selected>15 сек</option>
        <option value="30">30 сек</option>
        <option value="60">1 мин</option>
      </select>
      <span id="autoStatus" style="color:#fbbf24; font-size:0.9rem;"></span>
    </div>

    <!-- Лог -->
    <div class="log" id="logContainer">
      <div class="log-entry">⌛ Ожидание действий...</div>
    </div>
  </div>

  <script>
    (function() {
      // Элементы интерфейса
      const permissionIndicator = document.getElementById('permissionIndicator');
      const permissionLabel = document.getElementById('permissionLabel');
      const requestPermissionBtn = document.getElementById('requestPermissionBtn');
      const sendNowBtn = document.getElementById('sendNowBtn');
      const scheduleOnceBtn = document.getElementById('scheduleOnceBtn');
      const intervalSelect = document.getElementById('intervalSelect');
      const autoStatusSpan = document.getElementById('autoStatus');
      const logContainer = document.getElementById('logContainer');
      
      // Поля ввода
      const titleInput = document.getElementById('notifTitle');
      const bodyInput = document.getElementById('notifBody');
      const iconInput = document.getElementById('notifIcon');
      const tagInput = document.getElementById('notifTag');

      // Состояние
      let autoIntervalId = null;
      let scheduledTimeoutId = null;

      // ========== Утилиты ==========
      const addLog = (message, isWarning = false) => {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        entry.textContent = `[${time}] ${message}`;
        if (isWarning) entry.style.color = '#fca5a5';
        logContainer.prepend(entry);
        // Ограничим количество записей
        if (logContainer.children.length > 8) {
          logContainer.removeChild(logContainer.lastChild);
        }
      };

      // Обновление индикатора разрешений
      const updatePermissionUI = () => {
        if (!('Notification' in window)) {
          permissionIndicator.className = 'indicator denied';
          permissionLabel.textContent = 'API не поддерживается';
          requestPermissionBtn.disabled = true;
          addLog('❌ Браузер не поддерживает уведомления', true);
          return false;
        }

        const permission = Notification.permission;
        permissionIndicator.classList.remove('granted', 'denied', 'prompt');
        
        switch (permission) {
          case 'granted':
            permissionIndicator.classList.add('granted');
            permissionLabel.textContent = 'Уведомления разрешены';
            requestPermissionBtn.disabled = true;
            addLog('✅ Доступ к уведомлениям предоставлен');
            break;
          case 'denied':
            permissionIndicator.classList.add('denied');
            permissionLabel.textContent = 'Уведомления запрещены';
            requestPermissionBtn.disabled = false; // можно попытаться изменить (в некоторых браузерах)
            addLog('🚫 Пользователь отклонил уведомления', true);
            break;
          case 'default':
          default:
            permissionIndicator.classList.add('prompt');
            permissionLabel.textContent = 'Ожидание разрешения';
            requestPermissionBtn.disabled = false;
            addLog('❓ Необходимо запросить разрешение');
            break;
        }
        return true;
      };

      // Запрос разрешения
      const requestNotificationPermission = async () => {
        if (!('Notification' in window)) {
          alert('Ваш браузер не поддерживает уведомления.');
          return;
        }
        try {
          const result = await Notification.requestPermission();
          updatePermissionUI();
          if (result === 'granted') {
            addLog('🎉 Пользователь разрешил уведомления!');
          } else if (result === 'denied') {
            addLog('😞 Уведомления отклонены.', true);
          }
        } catch (error) {
          addLog(`Ошибка запроса: ${error.message}`, true);
        }
      };

      // Отправка уведомления
      const sendNotification = (customTitle, customBody, customIcon, customTag) => {
        if (!('Notification' in window)) {
          addLog('Нет поддержки Notification API', true);
          return;
        }
        if (Notification.permission !== 'granted') {
          addLog('Нет разрешения на отправку уведомлений', true);
          updatePermissionUI();
          // Автоматически запросить еще раз? Лучше показать кнопку.
          return;
        }

        const title = customTitle || titleInput.value || 'Без названия';
        const options = {
          body: customBody || bodyInput.value || 'Текст отсутствует.',
          icon: customIcon || iconInput.value || undefined,
          tag: customTag || tagInput.value || 'default',
          requireInteraction: false,
          silent: false,
        };

        // Очищаем пустые строки
        if (!options.icon) delete options.icon;
        if (!options.tag) options.tag = 'general';

        try {
          const notification = new Notification(title, options);
          
          notification.onshow = () => {
            addLog(`📬 Показано: "${title}"`);
          };
          
          notification.onclick = (event) => {
            event.preventDefault();
            addLog(`🖱️ Клик по уведомлению: "${title}"`);
            window.focus();
            notification.close();
          };
          
          notification.onerror = (e) => {
            addLog(`⚠️ Ошибка уведомления: ${e}`, true);
          };
          
          notification.onclose = () => {
            // просто закрыто
          };
          
          addLog(`✉️ Отправлено: "${title}"`);
        } catch (error) {
          addLog(`Ошибка создания: ${error.message}`, true);
        }
      };

      // Запланированная отправка (однократно)
      const scheduleSingleNotification = (delaySeconds = 5) => {
        if (Notification.permission !== 'granted') {
          addLog('Сначала предоставьте разрешение', true);
          return;
        }
        addLog(`⏳ Уведомление будет отправлено через ${delaySeconds} сек.`);
        
        if (scheduledTimeoutId) clearTimeout(scheduledTimeoutId);
        
        scheduledTimeoutId = setTimeout(() => {
          sendNotification(
            '⏰ Запланированное',
            `Это уведомление пришло через ${delaySeconds} секунд после нажатия.`,
            iconInput.value || undefined,
            'scheduled'
          );
          scheduledTimeoutId = null;
        }, delaySeconds * 1000);
      };

      // Управление автоматической отправкой
      const stopAutoSend = () => {
        if (autoIntervalId) {
          clearInterval(autoIntervalId);
          autoIntervalId = null;
          autoStatusSpan.textContent = '';
          addLog('🛑 Авто-отправка остановлена');
        }
      };

      const startAutoSend = (intervalSeconds) => {
        if (intervalSeconds <= 0) {
          stopAutoSend();
          intervalSelect.value = '0';
          return;
        }
        
        if (Notification.permission !== 'granted') {
          addLog('Не могу запустить авто: нет разрешений', true);
          intervalSelect.value = '0';
          return;
        }

        stopAutoSend(); // очистим предыдущий
        
        autoStatusSpan.textContent = `активна (${intervalSeconds}с)`;
        addLog(`🔄 Авто-отправка каждые ${intervalSeconds} сек.`);
        
        autoIntervalId = setInterval(() => {
          // Используем текущие значения полей, либо авто-заголовок
          const autoTitle = `🔄 Авто: ${titleInput.value || 'Сигнал'}`;
          const autoBody = bodyInput.value || 'Автоматическое уведомление по расписанию.';
          sendNotification(autoTitle, autoBody, iconInput.value || undefined, 'auto');
        }, intervalSeconds * 1000);
      };

      const onIntervalChange = () => {
        const val = parseInt(intervalSelect.value, 10);
        if (isNaN(val) || val <= 0) {
          stopAutoSend();
        } else {
          startAutoSend(val);
        }
      };

      // Сброс при закрытии страницы (очистка интервалов)
      const cleanupTimers = () => {
        stopAutoSend();
        if (scheduledTimeoutId) {
          clearTimeout(scheduledTimeoutId);
          scheduledTimeoutId = null;
        }
      };

      // Привязка событий
      const bindEvents = () => {
        requestPermissionBtn.addEventListener('click', requestNotificationPermission);
        
        sendNowBtn.addEventListener('click', () => {
          sendNotification();
        });
        
        scheduleOnceBtn.addEventListener('click', () => {
          scheduleSingleNotification(5);
        });
        
        intervalSelect.addEventListener('change', onIntervalChange);
        
        window.addEventListener('beforeunload', cleanupTimers);
        document.addEventListener('visibilitychange', () => {
          // Обновим статус разрешений, если пользователь мог изменить в настройках
          if (!document.hidden) {
            updatePermissionUI();
          }
        });
      };

      // Инициализация
      const init = () => {
        if (!('Notification' in window)) {
          permissionIndicator.className = 'indicator denied';
          permissionLabel.textContent = 'Не поддерживается';
          requestPermissionBtn.disabled = true;
          addLog('Браузер не поддерживает уведомления', true);
        } else {
          updatePermissionUI();
        }
        bindEvents();
        addLog('📋 Центр уведомлений готов');
      };

      init();
    })();
  </script>
</body>
</html>
