<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#030617">
    <title>🤖 E·GPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030617;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        input, textarea { user-select: text; -webkit-user-select: text; }
        :root { --chat-font-size: 16px; }
        body.theme-светлая {
            --bg-color: #f8f9fa; --panel-bg: #ffffff; --text-color: #1a1a2e; --border-color: #b0b7c4;
            --input-bg: #ffffff; --user-msg-start: #4361ee; --user-msg-end: #7209b7;
            --ai-msg-bg: #e9ecef; --ai-msg-text: #1a1a2e; --placeholder-color: #6c757d;
            --capsule-bg: #fff3e0; --capsule-border: #e6b422; --capsule-text: #8b6b2c; --link-color: #6f42c1;
        }
        body.theme-тёмная {
            --bg-color: #030617; --panel-bg: rgba(0, 0, 0, 0.75); --text-color: #f0f0f0;
            --border-color: rgba(255, 255, 255, 0.35); --input-bg: rgba(0, 0, 0, 0.5);
            --user-msg-start: #3b82f6; --user-msg-end: #8b5cf6;
            --ai-msg-bg: rgba(255, 255, 255, 0.15); --ai-msg-text: #f0f0f0; --placeholder-color: #aaa;
            --capsule-bg: rgba(255, 200, 100, 0.2); --capsule-border: #ffaa33; --capsule-text: #ffdd99; --link-color: #aa88ff;
        }
        body.theme-океан {
            --bg-color: #0a4c6e; --panel-bg: rgba(0, 70, 100, 0.9); --text-color: #e0f7ff;
            --border-color: rgba(255, 255, 255, 0.35); --ai-msg-bg: rgba(72, 202, 228, 0.25); --ai-msg-text: #e0f7ff;
            --capsule-text: #b3e4f5; --user-msg-start: #00b4d8; --user-msg-end: #0077b6;
        }
        body.theme-лес {
            --bg-color: #1a4d2c; --panel-bg: rgba(30, 80, 45, 0.9); --text-color: #e8f5e9;
            --border-color: rgba(255, 255, 255, 0.35); --ai-msg-bg: rgba(106, 153, 78, 0.25); --ai-msg-text: #e8f5e9;
            --user-msg-start: #6a994e; --user-msg-end: #2b6e3c;
        }
        body.theme-закат {
            --bg-color: #c45c2c; --panel-bg: rgba(100, 50, 20, 0.9); --text-color: #fff0e0;
            --border-color: rgba(255, 255, 255, 0.35); --user-msg-start: #f4a261; --user-msg-end: #e76f51;
            --ai-msg-bg: rgba(244, 162, 97, 0.2); --ai-msg-text: #fff0e0;
        }
        body.theme-кибер {
            --bg-color: #0d0b2b; --panel-bg: rgba(0, 0, 0, 0.85); --text-color: #0affcc;
            --border-color: rgba(10, 255, 204, 0.35); --user-msg-start: #ff00cc; --user-msg-end: #00ffcc;
            --ai-msg-bg: rgba(10, 255, 204, 0.1); --ai-msg-text: #0affcc; --capsule-border: #ff00cc; --link-color: #ff66cc;
        }
        body.theme-конфетти {
            --bg-color: #e67a9e; --panel-bg: rgba(210, 100, 130, 0.9); --text-color: #2c1a1f;
            --border-color: rgba(44, 26, 31, 0.35); --user-msg-start: #ffb7c5; --user-msg-end: #ff6f91;
            --ai-msg-bg: rgba(255, 200, 210, 0.3); --ai-msg-text: #2c1a1f;
        }
        body.theme-полночь {
            --bg-color: #10152e; --panel-bg: rgba(0, 0, 0, 0.85); --text-color: #bcc9ff;
            --border-color: rgba(188, 201, 255, 0.35); --user-msg-start: #5f7aff; --user-msg-end: #3b4bff;
            --ai-msg-bg: rgba(95, 122, 255, 0.15); --ai-msg-text: #bcc9ff;
        }
        body.theme-сакура {
            --bg-color: #f5c2c2; --panel-bg: rgba(245, 200, 200, 0.9); --text-color: #5e3a3a;
            --border-color: rgba(94, 58, 58, 0.35); --user-msg-start: #f4acb7; --user-msg-end: #e68a8a;
            --ai-msg-bg: rgba(244, 172, 183, 0.3); --ai-msg-text: #5e3a3a;
        }
        body.theme-пустыня {
            --bg-color: #cd9f6e; --panel-bg: rgba(180, 130, 70, 0.9); --text-color: #2f241b;
            --border-color: rgba(47, 36, 27, 0.35); --user-msg-start: #e9c891; --user-msg-end: #b47c48;
            --ai-msg-bg: rgba(233, 200, 145, 0.25); --ai-msg-text: #2f241b;
        }
        body.theme-северное-сияние {
            --bg-color: #1e5f5f; --panel-bg: rgba(30, 100, 90, 0.9); --text-color: #d1f7f2;
            --border-color: rgba(209, 247, 242, 0.35); --user-msg-start: #72efdb; --user-msg-end: #48cae4;
            --ai-msg-bg: rgba(114, 239, 219, 0.15); --ai-msg-text: #d1f7f2;
        }
        body.theme-кофе {
            --bg-color: #6b4c3b; --panel-bg: rgba(80, 55, 40, 0.9); --text-color: #f7e8d4;
            --border-color: rgba(247, 232, 212, 0.35); --user-msg-start: #c2a575; --user-msg-end: #a67b4e;
            --ai-msg-bg: rgba(194, 165, 117, 0.2); --ai-msg-text: #f7e8d4;
        }
        body { background-color: var(--bg-color); color: var(--text-color); }
        .native-splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a0b2e; display: flex; align-items: center; justify-content: center;
            z-index: 2000; flex-direction: column;
        }
        .splash-content { text-align: center; }
        .splash-title {
            font-size: 42px; font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            letter-spacing: 2px; margin-bottom: 20px;
        }
        .splash-copyright {
            position: absolute; bottom: 30px; left: 0; right: 0;
            text-align: center; color: rgba(255,255,255,0.5); font-size: 14px;
        }
        @media (max-width:600px) { .splash-title { font-size: 28px; } }
        .version-badge {
            position: fixed; top: 12px; left: 12px;
            background: rgba(0,255,255,0.2); border: 1px solid #00ffff;
            border-radius: 30px; padding: 4px 12px; font-size: 12px; font-weight: 600;
            color: #00ffff; z-index: 100; backdrop-filter: blur(5px);
            max-width: calc(100% - 100px); white-space: nowrap; overflow-x: auto; scrollbar-width: none;
        }
        .version-badge::-webkit-scrollbar { display: none; }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12,20,35,0.98); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .loading-container {
            text-align: center; background: rgba(12,20,35,0.95);
            border: 3px solid #00ffff; border-radius: 60px; padding: 50px 40px;
            animation: borderGlow 2s infinite;
        }
        @keyframes borderGlow {
            0% { border-color:#00ffff; box-shadow:0 0 20px #00ffff; }
            50% { border-color:#ff66b2; box-shadow:0 0 35px #ff66b2; }
            100% { border-color:#00ffff; box-shadow:0 0 20px #00ffff; }
        }
        .progress-circle { position:relative; width:150px; height:150px; margin:0 auto 30px; }
        .progress-svg { width:100%; height:100%; transform:rotate(-90deg); }
        .progress-bg { fill:none; stroke:rgba(255,255,255,0.2); stroke-width:8; }
        .progress-fill { fill:none; stroke:#00ffff; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 0.05s linear; }
        .progress-text {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            color:white; font-size:32px; font-weight:bold; text-shadow:0 0 15px #00ffff;
        }
        .loading-title { color:white; font-size:28px; font-weight:700; margin-top:20px; letter-spacing:2px; }
        .error-block {
            max-width:500px; width:90%; background:rgba(12,20,35,0.95);
            border:3px solid #ff8c00; border-radius:60px; padding:40px;
            text-align:center; color:white; margin:20px;
        }
        .error-block h1 { font-size:60px; margin-bottom:20px; }
        .error-block .error-message {
            background:rgba(255,140,0,0.1); border:1px solid #ff8c00;
            border-radius:40px; padding:20px; margin:30px 0; color:#ffaa66;
        }
        .toast {
            position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
            background:#1a1a2e; backdrop-filter:blur(12px); padding:12px 24px;
            border-radius:60px; font-size:14px; font-weight:500; z-index:3000;
            white-space:nowrap; opacity:0; transition:opacity 0.2s; pointer-events:none;
            text-align:center; box-shadow:0 4px 15px rgba(0,0,0,0.3);
        }
        .toast.show { opacity:1; }
        .toast.info { border:1px solid #00ffff; color:#00ffff; }
        .toast.error { border:1px solid #ff5555; color:#ff8888; }
        .toast.success { border:1px solid #88ffaa; color:#88ffaa; }
        .main-screen { width:100%; height:100%; padding:16px; display:none; flex-direction:column; }
        .glass-panel {
            background:var(--panel-bg); backdrop-filter:blur(12px);
            border-radius:48px; padding:20px; flex:1; display:flex; flex-direction:column;
            border:1px solid var(--border-color); overflow:hidden;
        }
        .top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:relative; }
        .left-group { display:flex; align-items:center; gap:12px; min-width:0; flex-shrink:1; }
        .right-group { display:flex; align-items:center; gap:8px; flex-shrink:0; }
        .logo-icon { width:52px; height:52px; object-fit:contain; border-radius:16px; flex-shrink:0; }
        .version-badge-top {
            background:rgba(0,255,255,0.2); border:1px solid #00ffff;
            border-radius:30px; padding:4px 12px; font-size:12px; font-weight:600;
            color:#00ffff; backdrop-filter:blur(5px); white-space:nowrap;
            overflow-x:auto; max-width:200px; scrollbar-width:none;
        }
        .version-badge-top::-webkit-scrollbar { display:none; }
        .app-title {
            font-size:26px; font-weight:700;
            background:linear-gradient(135deg,#fff,#88ddff);
            -webkit-background-clip:text; background-clip:text; color:transparent;
            text-align:center; flex:1;
        }
        .admin-toggle,.settings-icon {
            background:none; border:none; font-size:26px; cursor:pointer;
            width:44px; height:44px; border-radius:30px; transition:0.2s; color:var(--text-color);
        }
        .admin-toggle.active { filter:drop-shadow(0 0 15px #ffaa33); }
        .chat-area {
            flex:1; overflow-y:auto; background:rgba(0,0,0,0.2);
            border-radius:30px; padding:16px; margin:12px 0;
            display:flex; flex-direction:column; gap:12px;
        }
        .message {
            max-width:85%; padding:10px 16px; border-radius:24px;
            word-break:break-word; position:relative;
            font-size:var(--chat-font-size); line-height:1.4;
        }
        .message-user {
            align-self:flex-end;
            background:linear-gradient(135deg,var(--user-msg-start),var(--user-msg-end));
            color:white; border-bottom-right-radius:8px;
        }
        .message-ai {
            align-self:flex-start; background:var(--ai-msg-bg);
            color:var(--ai-msg-text); border-bottom-left-radius:8px;
        }
        .message-typing {
            align-self:flex-start; background:rgba(30,30,50,0.9);
            color:#ccc; font-style:italic; border-left:3px solid #00ffff;
            padding-left:12px; border-bottom-left-radius:8px;
        }
        .copy-btn {
            position:absolute; bottom:5px; right:8px; background:none;
            border:none; font-size:14px; cursor:pointer; opacity:0.5; transition:0.2s; color:inherit;
        }
        .copy-btn:hover { opacity:1; }
        .admin-capsules { display:flex; flex-direction:column; gap:12px; margin:12px 0; overflow-y:auto; flex:1; }
        .capsule {
            background:var(--capsule-bg); border:1px solid var(--capsule-border);
            border-radius:30px; padding:12px 18px; color:var(--capsule-text);
            font-size:14px; line-height:1.4;
        }
        .input-wrapper {
            display:flex; align-items:flex-end; background:var(--input-bg);
            border-radius:24px; padding:8px 12px; gap:8px; margin-top:6px;
            border:2px solid var(--border-color);
        }
        .send-btn {
            flex-shrink:0; width:44px; height:44px; background:none;
            border:none; font-size:26px; cursor:pointer; border-radius:30px;
            transition:0.2s; display:flex; align-items:center; justify-content:center; color:var(--text-color);
        }
        .message-input {
            flex:1; background:transparent; border:none; font-size:16px;
            color:var(--text-color); outline:none; resize:none; font-family:inherit;
            max-height:120px; overflow-y:auto; line-height:1.4; padding:8px 0;
        }
        .bottom-copy { text-align:center; font-size:11px; color:rgba(255,255,255,0.5); margin-top:8px; }
        .modal {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.9); backdrop-filter:blur(10px);
            display:none; align-items:center; justify-content:center; z-index:2000;
        }
        .modal-card {
            background:#1a1a2e; border-radius:40px; width:90%; max-width:500px;
            max-height:85vh; display:flex; flex-direction:column;
            border:1px solid #00ffff; overflow:hidden;
        }
        .modal-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:20px 24px 16px; flex-shrink:0; position:sticky; top:0;
            background:#1a1a2e; z-index:10; border-radius:40px 40px 0 0;
        }
        .modal-header h3 { color:white; font-size:24px; margin:0; }
        .modal-close-btn {
            background:rgba(255,255,255,0.15); border:none; color:white;
            font-size:22px; width:40px; height:40px; border-radius:50%;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:0.2s; flex-shrink:0;
        }
        .modal-close-btn:hover { background:rgba(255,80,80,0.5); }
        .modal-body { padding:0 24px 24px; overflow-y:auto; flex:1; }
        .setting { margin-bottom:20px; }
        .setting label { display:flex; justify-content:space-between; color:white; margin-bottom:8px; font-weight:500; font-size:16px; }
        .setting select, .setting input[type="range"] {
            width:100%; padding:12px; border-radius:40px;
            background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3);
            color:white; font-size:15px;
        }
        .toggle { position:relative; display:inline-block; width:52px; height:26px; }
        .toggle input { opacity:0; width:0; height:0; }
        .toggle-slider {
            position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
            background-color:#ccc; border-radius:34px; transition:0.3s;
        }
        .toggle-slider:before {
            position:absolute; content:""; height:20px; width:20px;
            left:3px; bottom:3px; background-color:white; border-radius:50%; transition:0.3s;
        }
        input:checked+.toggle-slider { background-color:#3b82f6; }
        input:checked+.toggle-slider:before { transform:translateX(26px); }
        .modal-btns { display:flex; gap:12px; flex-wrap:wrap; margin-top:24px; }
        .modal-btn {
            flex:1; background:rgba(255,255,255,0.15); border:none;
            border-radius:40px; padding:12px; color:white; cursor:pointer;
            font-weight:500; transition:0.1s; font-size:14px;
        }
        .staff-input {
            width:100%; padding:14px; border-radius:40px;
            background:rgba(255,255,255,0.1); border:1px solid #00ffff;
            color:white; margin-bottom:20px; text-align:center; font-size:16px;
        }
        .policy-content {
            white-space:pre-wrap; line-height:1.5; max-height:60vh;
            overflow-y:auto; padding:10px; color:#e0e0e0; font-size:14px;
        }
        .hidden { display:none; }
        .pulse:active { animation:btnPulse 0.2s ease; }
        @keyframes btnPulse {
            0% { transform:scale(1); }
            50% { transform:scale(0.94); background:rgba(255,255,255,0.3); }
            100% { transform:scale(1); }
        }
        @media (max-width:600px) {
            .main-screen { padding:8px; }
            .glass-panel { padding:12px; margin-top:28px; }
            .logo-icon { width:44px; height:44px; }
            .version-badge-top { font-size:10px; max-width:150px; }
            .app-title { font-size:20px; }
            .admin-toggle,.settings-icon { width:40px; height:40px; font-size:24px; }
            .message { font-size:calc(var(--chat-font-size) - 1px); max-width:90%; }
            .message-input { font-size:15px; }
        }
    </style>
</head>
<body>

    <div id="nativeSplash" class="native-splash">
        <div class="splash-content"><div class="splash-title">E·GPT</div></div>
        <div class="splash-copyright">© ErmakArtekovec</div>
    </div>

    <div id="loadingScreen" class="loading-screen">
        <div class="loading-container">
            <div class="progress-circle">
                <svg class="progress-svg" viewBox="0 0 100 100">
                    <circle class="progress-bg" cx="50" cy="50" r="42"></circle>
                    <circle id="progressCircleFill" class="progress-fill" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle>
                </svg>
                <div class="progress-text" id="progressPercent">0</div>
            </div>
            <div class="loading-title">E·GPT</div>
        </div>
    </div>

    <div id="mainScreen" class="main-screen">
        <div class="glass-panel">
            <div class="top-bar">
                <div class="left-group">
                    <img id="logoIcon" class="logo-icon" alt="logo">
                    <div id="versionBadge" class="version-badge-top"></div>
                </div>
                <div class="app-title">E·GPT</div>
                <div class="right-group">
                    <button class="admin-toggle" id="adminToggleBtn">🔔</button>
                    <button class="settings-icon" id="settingsBtn">⚙️</button>
                </div>
            </div>
            <div id="chatArea" class="chat-area"></div>
            <div id="adminCapsulesArea" class="admin-capsules hidden"></div>
            <div class="input-wrapper">
                <textarea id="messageInput" class="message-input" rows="1" placeholder="Напишите сообщение..."></textarea>
                <button class="send-btn" id="sendBtn">🚀</button>
            </div>
            <div class="bottom-copy">© ErmakArtekovec</div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-card">
            <div class="modal-header"><h3>⚙️ Настройки</h3><button class="modal-close-btn" id="closeSettingsBtn">✕</button></div>
            <div class="modal-body">
                <div class="setting"><label>🎨 Тема</label><select id="themeSelect"></select></div>
                <div class="setting" id="agentSetting"><label>🧠 AI Агенты</label><select id="agentSelect"></select></div>
                <div class="setting"><label>🔇 Отключить все звуки</label><label class="toggle"><input type="checkbox" id="allSoundsToggle"><span class="toggle-slider"></span></label></div>
                <div class="setting"><label>🔊 Громкость (<span id="volumeVal">100</span>%)</label><input type="range" id="volumeSlider" min="0" max="100" step="1" value="100"></div>
                <div class="setting"><label>🧩 Контекст (<span id="contextVal">5</span>)</label><input type="range" id="contextSlider" min="0" max="10" step="1" value="5"></div>
                <div class="setting"><label>📏 Размер шрифта (<span id="fontSizeVal">16</span>px)</label><input type="range" id="fontSlider" min="12" max="24" step="1" value="16"></div>
                <div id="staffInfo" class="hidden" style="background:rgba(255,255,255,0.1); border-radius:24px; padding:12px; margin-bottom:16px; text-align:center;"></div>
                <div class="modal-btns">
                    <button class="modal-btn" id="resetBtn">🔄 Сброс</button>
                    <button class="modal-btn" id="clearChatBtn">🗑️ Очистить чат</button>
                    <button class="modal-btn" id="privacyBtn">📜 Политика</button>
                    <button class="modal-btn" id="staffLoginBtn">🔑 Вход для персонала</button>
                    <button class="modal-btn" id="staffLogoutBtn" style="display:none">🚪 Выйти</button>
                </div>
            </div>
        </div>
    </div>

    <div id="privacyModal" class="modal">
        <div class="modal-card">
            <div class="modal-header"><h3>📜 Политика конфиденциальности</h3><button class="modal-close-btn" id="closePrivacyBtn">✕</button></div>
            <div class="modal-body"><div id="privacyContent" class="policy-content">Загрузка...</div></div>
        </div>
    </div>

    <div id="staffLoginModal" class="modal">
        <div class="modal-card">
            <div class="modal-header"><h3>🔑 Вход для персонала</h3><button class="modal-close-btn" id="cancelStaffBtn">✕</button></div>
            <div class="modal-body">
                <input type="text" id="staffIdInput" class="staff-input" placeholder="Введите ваш ID">
                <button class="modal-btn" id="confirmStaffBtn" style="width:100%; margin-top:10px;">Войти</button>
                <div id="staffError" style="color:#ff5555; margin-top:12px; text-align:center; display:none">❌ ID не найден в базе</div>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast"></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGuQN1jFc0M8FoQDd2roUJ6tT6kr8NVV_SINUkbInBJJ3rrAHMQ_AN3Jw9QLHtTo4/exec';
        const SECRET_KEY = 'eG3n1us2025';

        let config = { system: {}, aiCore: '', adminMessages: [], agents: [], staffUsers: [], staffModels: {}, staffKeys: {} };
        let currentUser = null;
        let chatHistory = [];
        let allSoundsEnabled = true;
        let currentVolume = 100;
        let currentTheme = 'тёмная';
        let currentFontSize = 16;
        let adminModeActive = false;
        let selectedAgentIndex = 0;
        let contextCount = 5;
        let audioCtx = null, gainNode = null, entrySoundBuffer = null, typingSoundBuffer = null, tapSoundBuffer = null;
        let firstInteraction = false;
        let isWaitingForAI = false;
        let appVersion = '';
        let databaseLoadFailed = false;
        let wakeLock = null;

        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        const themeColors = {
            'светлая': '#f8f9fa', 'тёмная': '#030617', 'океан': '#0a4c6e', 'лес': '#1a4d2c',
            'закат': '#c45c2c', 'кибер': '#0d0b2b', 'конфетти': '#e67a9e', 'полночь': '#10152e',
            'сакура': '#f5c2c2', 'пустыня': '#cd9f6e', 'северное-сияние': '#1e5f5f', 'кофе': '#6b4c3b'
        };
        function updateThemeColor(t) { if (themeColorMeta && themeColors[t]) themeColorMeta.setAttribute('content', themeColors[t]); }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {});
                }
            } catch (e) {}
        }

        const nativeSplash = document.getElementById('nativeSplash');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainScreen = document.getElementById('mainScreen');
        const chatArea = document.getElementById('chatArea');
        const adminCapsulesArea = document.getElementById('adminCapsulesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoIcon = document.getElementById('logoIcon');
        const settingsModal = document.getElementById('settingsModal');
        const themeSelect = document.getElementById('themeSelect');
        const agentSelect = document.getElementById('agentSelect');
        const agentSetting = document.getElementById('agentSetting');
        const allSoundsToggle = document.getElementById('allSoundsToggle');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = document.getElementById('volumeVal');
        const contextSlider = document.getElementById('contextSlider');
        const contextVal = document.getElementById('contextVal');
        const fontSlider = document.getElementById('fontSlider');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const staffInfo = document.getElementById('staffInfo');
        const staffLogoutBtn = document.getElementById('staffLogoutBtn');
        const adminToggleBtn = document.getElementById('adminToggleBtn');
        const progressFill = document.getElementById('progressCircleFill');
        const progressPercent = document.getElementById('progressPercent');
        const toastDiv = document.getElementById('toastMsg');
        const versionBadge = document.getElementById('versionBadge');
        const circumference = 264;

        function showToast(msg, type = 'info') {
            toastDiv.textContent = msg;
            toastDiv.classList.remove('info', 'error', 'success');
            toastDiv.classList.add(type, 'show');
            setTimeout(() => toastDiv.classList.remove('show'), 2500);
        }

        function updateProgress(p) {
            const o = circumference - (p / 100) * circumference;
            if (progressFill) progressFill.style.strokeDashoffset = o;
            if (progressPercent) progressPercent.innerText = Math.floor(p);
        }

        function getSection(text, name) {
            const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const m = text.match(new RegExp(`\\[${esc}\\]([\\s\\S]*?)(?=\\[|$)`, 'i'));
            return m ? m[1].trim() : '';
        }

        function showErrorBlock(msg) {
            loadingScreen.style.display = 'none';
            mainScreen.style.display = 'none';
            if (nativeSplash) nativeSplash.style.display = 'none';
            const ex = document.getElementById('globalErrorBlock');
            if (ex) ex.remove();
            const d = document.createElement('div');
            d.id = 'globalErrorBlock';
            d.className = 'error-block';
            d.innerHTML = `<h1>⚠️</h1><div class="error-message">${escapeHtml(msg)}</div><div>Попробуйте позже<br>© ErmakArtekovec</div>`;
            document.body.appendChild(d);
            databaseLoadFailed = true;
        }

        function escapeHtml(s) { return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

        async function fetchAPI(action, fileId = null) {
            let u = `${SCRIPT_URL}?action=${action}&secret=${SECRET_KEY}`;
            if (fileId) u += `&fileId=${encodeURIComponent(fileId)}`;
            try { const r = await fetch(u); const t = await r.text(); try { return JSON.parse(t); } catch (e) { return { success: false, error: 'Invalid JSON' }; } } catch (e) { return { success: false, error: e.message }; }
        }

        async function loadDatabaseWithTimeout(ms = 12000) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), ms);
            try { const r = await fetch(`${SCRIPT_URL}?action=getDatabase&secret=${SECRET_KEY}`, { signal: c.signal }); clearTimeout(t); const tx = await r.text(); try { return JSON.parse(tx); } catch (e) { return { success: false, error: 'Invalid JSON' }; } } catch (e) { clearTimeout(t); return { success: false, error: e.message }; }
        }

        async function loadDatabase() {
            updateProgress(5);
            const r = await loadDatabaseWithTimeout(12000);
            if (!r || !r.success || !r.text) { showErrorBlock('Нет интернета или задержка с подключением к серверу — пожалуйста, попробуйте зайти сюда позже или проверьте обновления в официальном магазине приложений RuStore.'); return false; }
            updateProgress(40);
            const txt = r.text;
            const ss = getSection(txt, 'Системные данные');
            const gv = (k) => { const ek = k.replace(/\s+/g, '\\s+'); const m = ss.match(new RegExp(ek + ':\\s*(.+)', 'i')); return m ? m[1].trim() : null; };
            config.system = {
                logoId: gv('ID Логотипа'), entrySoundId: gv('ID Фирменного звука входа'),
                typingSoundId: gv('ID звука набора текста'), tapSoundId: gv('ID тапа на элементы приложения'),
                fontId: gv('ID файла шрифта'), privacyId: gv('ID политики конфиденциальности')
            };
            const vm = ss.match(/Версия:\s*(.+)/i);
            appVersion = vm ? vm[1].trim() : '';
            if (appVersion) versionBadge.textContent = appVersion; else versionBadge.style.display = 'none';
            const am = ss.match(/Состояние приложения:\s*(Yes|No)/i);
            const as = am ? am[1] : 'Yes';
            const bm = ss.match(/Уведомление отключённого приложения:\s*(.+)/i)?.[1]?.trim() || 'Сервис временно недоступен.';
            if (as !== 'Yes') { showErrorBlock(bm); return false; }
            config.aiCore = getSection(txt, 'aiCore') || 'Ты полезный ассистент.';
            const adm = getSection(txt, 'Сообщения от админа');
            config.adminMessages = adm ? adm.split('\n').filter(l => l.trim()) : [];
            const ags = getSection(txt, 'AI_Agents');
            config.agents = [];
            if (ags) { const ls = ags.split('\n'); let cur = {}; for (let i = 0; i < ls.length; i++) { const l = ls[i].trim(); if (l === '') continue; if (!cur.name) cur.name = l; else if (!cur.model) cur.model = l; else if (!cur.key) { cur.key = l;
                        config.agents.push(cur);
                        cur = {}; } } }
            const stf = getSection(txt, 'Данные персонала');
            config.staffUsers = [];
            config.staffModels = {};
            config.staffKeys = {};
            if (stf) { const ls = stf.split('\n'); for (let i = 0; i < ls.length; i++) { let lo = ls[i]?.trim(),
                        mo = ls[i + 1]?.trim(),
                        ke = ls[i + 2]?.trim(); if (lo && mo && ke && !lo.startsWith('[') && !mo.startsWith('[') && !ke
                            .startsWith('[')) { config.staffUsers.push(lo);
                        config.staffModels[lo] = mo;
                        config.staffKeys[lo] = ke;
                        i += 2; } } }
            updateProgress(60); return true;
        }

        async function loadFont() { if (!config.system.fontId) return true; try { const r = await fetchAPI('getFile', config.system.fontId); if (r.success && r.data) { const ff = new FontFace('CustomFont', `url(data:${r.mimeType};base64,${r.data})`); await ff.load();
                    document.fonts.add(ff);
                    document.body.style.fontFamily = "'CustomFont','Segoe UI',system-ui,-apple-system,sans-serif"; return true; } return false; } catch (e) { return false; } }

        async function loadMedia() {
            if (config.system.logoId) { const r = await fetchAPI('getFile', config.system.logoId); if (r.success && r.data) logoIcon.src = 'data:' + r.mimeType + ';base64,' + r.data; else return false; }
            updateProgress(75);
            const ls = async (id) => { if (!id) return null; const r = await fetchAPI('getFile', id); if (r.success && r.data) { const b = atob(r.data); const arr = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) arr[i] = b.charCodeAt(i); return arr.buffer; } return false; };
            if (config.system.entrySoundId) { const r = await ls(config.system.entrySoundId); if (r === false) return false;
                entrySoundBuffer = r; }
            if (config.system.typingSoundId) { const r = await ls(config.system.typingSoundId); if (r === false) return false;
                typingSoundBuffer = r; }
            if (config.system.tapSoundId) { const r = await ls(config.system.tapSoundId); if (r === false) return false;
                tapSoundBuffer = r; }
            updateProgress(90); if (config.system.privacyId) { const r = await fetchAPI('getText', config.system.privacyId); if (r.success && r.text) window.privacyText = r.text; }
            updateProgress(100); return true;
        }

        function initAudio() { if (!audioCtx) { audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                gainNode = audioCtx.createGain();
                gainNode.gain.value = currentVolume / 100;
                gainNode.connect(audioCtx.destination); } }

        function updateVolume() { if (gainNode) gainNode.gain.value = currentVolume / 100; }

        async function playFeedback(buffer) { if (!allSoundsEnabled || !buffer) return;
            initAudio(); try { const ab = await audioCtx.decodeAudioData(buffer.slice(0)); const src = audioCtx
                    .createBufferSource();
                src.buffer = ab;
                src.connect(gainNode);
                src.start(); if (audioCtx.state === 'suspended') await audioCtx.resume(); } catch (e) {} }

        async function playEntrySound() { if (!allSoundsEnabled || !entrySoundBuffer || !firstInteraction) return; await playFeedback(
                entrySoundBuffer); }

        async function playTypingSound() { if (!allSoundsEnabled || !typingSoundBuffer) return; await playFeedback(
                typingSoundBuffer); }

        async function playTapSound() { if (!allSoundsEnabled || !tapSoundBuffer) return; await playFeedback(tapSoundBuffer); }

        function enableAudio() { if (firstInteraction) return;
            firstInteraction = true; if (allSoundsEnabled && entrySoundBuffer) playEntrySound(); }

        function scrollToBottom() { if (chatArea) chatArea.scrollTop = chatArea.scrollHeight; }

        function renderChat() {
            chatArea.innerHTML = '';
            if (!chatHistory.length) { chatArea.innerHTML =
                    '<div class="message message-ai">👋 Привет! Я E·GPT. Напиши что-нибудь...</div>'; } else { chatHistory
                    .forEach(m => { const d = document.createElement('div'); if (m.isTyping) { d.className =
                            'message message-typing';
                        d.innerText = m.content; } else { d.className =
                            `message ${m.role==='user'?'message-user':'message-ai'}`;
                        d.innerHTML = formatMessage(m.content); if (m.role === 'ai') { const c = document.createElement(
                                'button');
                            c.className = 'copy-btn';
                            c.innerHTML = '📋';
                            c.onclick = (e) => { e.stopPropagation();
                                navigator.clipboard.writeText(m.content);
                                showToast('Скопировано!', 'success'); };
                            d.appendChild(c); } }
                    chatArea.appendChild(d); }); }
            scrollToBottom();
        }

        function formatMessage(t) { const rg = /(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(?:\/[^\s]*)?)/g; return t
                .replace(rg, (u) => { let h = u; if (!h.startsWith('http')) h = 'https://' + h; return `<a href="${h}" target="_blank" rel="noopener noreferrer">${u}</a>`; }); }

        async function sendToAI(msg) {
            let ag = null; if (currentUser?.type === 'staff') { if (!config.staffModels[currentUser.id] || !config
                    .staffKeys[currentUser.id]) return "Ошибка: данные персонала не найдены";
                ag = { model: config.staffModels[currentUser.id], key: config.staffKeys[currentUser.id] }; } else { if (!config
                    .agents.length) return "Нет доступных агентов";
                ag = config.agents[selectedAgentIndex]; if (!ag) return "Выбранный агент недоступен"; }
            let ctx = []; if (contextCount > 0 && chatHistory.length) { const rec = chatHistory.filter(m => !m.isTyping).slice(-
                    contextCount);
                ctx = rec.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })); } try { const r = await fetch(
                    'https://openrouter.ai/api/v1/chat/completions', { method: 'POST', headers: { 'Authorization': `Bearer ${ag.key}`,
                            'Content-Type': 'application/json' }, body: JSON.stringify({ model: ag.model, messages: [{ role: 'system',
                                content: config.aiCore }, ...ctx, { role: 'user', content: msg }] }) }); const d = await r
                    .json(); if (d.choices?.[0]) return d.choices[0].message.content; return "Извините, произошла ошибка. Попробуйте позже."; } catch (
                e) { return "Ошибка соединения. Проверьте интернет."; }
        }

        async function sendMessage() { if (isWaitingForAI) { showToast('Уже отвечает', 'error'); return; } const t =
                messageInput.value.trim(); if (!t) return;
            isWaitingForAI = true;
            sendBtn.innerHTML = '⏹️';
            messageInput.value = '';
            messageInput.style.height = 'auto';
            chatHistory.push({ role: 'user', content: t });
            saveChat();
            renderChat(); const tid = Date.now();
            chatHistory.push({ role: 'ai', content: '💭 E·GPT печатает...', isTyping: true, id: tid });
            renderChat(); const r = await sendToAI(t); const idx = chatHistory.findIndex(m => m.id === tid); if (idx !== -1)
            chatHistory.splice(idx, 1); if (r) chatHistory.push({ role: 'ai', content: r });
            saveChat();
            renderChat();
            isWaitingForAI = false;
            sendBtn.innerHTML = '🚀'; }

        function saveChat() { localStorage.setItem('eGeniusChat', JSON.stringify(chatHistory.filter(m => !m.isTyping))); }

        function loadChat() { const r = localStorage.getItem('eGeniusChat');
            chatHistory = r ? JSON.parse(r) : [];
            renderChat(); }

        function clearChat() { chatHistory = [];
            saveChat();
            renderChat(); }

        const themes = ['светлая', 'тёмная', 'океан', 'лес', 'закат', 'кибер', 'конфетти', 'полночь', 'сакура', 'пустыня',
            'северное-сияние', 'кофе'
        ];

        function applyTheme(t) { document.body.classList.remove(...themes.map(x => `theme-${x}`));
            document.body.classList.add(`theme-${t}`);
            updateThemeColor(t); }

        function populateThemes() { themeSelect.innerHTML = themes.map(t =>
            `<option value="${t}" ${t===currentTheme?'selected':''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join(
            ''); }

        function saveSettings() { localStorage.setItem('eGeniusSettings', JSON.stringify({ theme: currentTheme,
                allSoundsEnabled, volume: currentVolume, fontSize: currentFontSize, contextCount,
            selectedAgentIndex })); }

        function loadSettings() { const r = localStorage.getItem('eGeniusSettings'); if (r) { try { const s = JSON.parse(r);
                    currentTheme = s.theme || 'тёмная';
                    allSoundsEnabled = s.allSoundsEnabled !== undefined ? s.allSoundsEnabled : true;
                    currentVolume = s.volume !== undefined ? s.volume : 100;
                    currentFontSize = s.fontSize || 16;
                    contextCount = (s.contextCount !== undefined) ? s.contextCount : 5;
                    selectedAgentIndex = s.selectedAgentIndex || 0; } catch (e) {} }
            applyTheme(currentTheme);
            allSoundsToggle.checked = !allSoundsEnabled;
            volumeSlider.value = currentVolume;
            volumeVal.innerText = currentVolume;
            updateVolume();
            contextSlider.value = contextCount;
            contextVal.innerText = contextCount;
            fontSlider.value = currentFontSize;
            fontSizeVal.innerText = currentFontSize;
            document.documentElement.style.setProperty('--chat-font-size', currentFontSize + 'px'); if (config.agents
                .length && selectedAgentIndex >= config.agents.length) selectedAgentIndex = 0; }

        function resetToDefault() { currentTheme = 'тёмная';
            allSoundsEnabled = true;
            currentVolume = 100;
            currentFontSize = 16;
            contextCount = 5;
            selectedAgentIndex = 0;
            applyTheme('тёмная');
            saveSettings();
            loadSettings(); if (config.agents.length && agentSelect) agentSelect.value = selectedAgentIndex; }

        function updateAgentSelect() { if (currentUser?.type === 'staff') { agentSetting.style.display = 'none'; return; }
            agentSetting.style.display = 'block';
            agentSelect.innerHTML = config.agents.length ? config.agents.map((a, i) =>
                `<option value="${i}" ${i===selectedAgentIndex?'selected':''}>${a.name}</option>`).join('') :
                '<option disabled>Нет агентов</option>'; }

        function toggleAdminMode() { adminModeActive = !adminModeActive; if (adminModeActive) { adminToggleBtn.classList.add(
                    'active');
                document.querySelector('.input-wrapper').style.display = 'none';
                chatArea.classList.add('hidden');
                adminCapsulesArea.classList.remove('hidden');
                adminCapsulesArea.innerHTML = config.adminMessages.map(m =>
                    `<div class="capsule">${escapeHtml(m)}</div>`).join(''); } else { adminToggleBtn.classList.remove(
                    'active');
                document.querySelector('.input-wrapper').style.display = 'flex';
                chatArea.classList.remove('hidden');
                adminCapsulesArea.classList.add('hidden'); } }

        function openPrivacy() { document.getElementById('privacyModal').style.display = 'flex';
            document.getElementById('privacyContent').innerHTML = window.privacyText ?
                '<div style="white-space:pre-wrap;">' + escapeHtml(window.privacyText) + '</div>' :
                'Не удалось загрузить политику.'; }

        function staffLogin() { const id = document.getElementById('staffIdInput').value.trim(); if (!id) { alert(
                    'Введите ID'); return; } if (config.staffUsers.includes(id)) { currentUser = { type: 'staff', id,
                    apiKey: config.staffKeys[id] };
                localStorage.setItem('eGeniusStaff', JSON.stringify(currentUser));
                staffInfo.classList.remove('hidden');
                staffInfo.innerHTML = `🔐 Персонал: ${id}`;
                staffLogoutBtn.style.display = 'block';
                document.getElementById('staffLoginBtn').style.display = 'none';
                document.getElementById('staffLoginModal').style.display = 'none';
                document.getElementById('staffError').style.display = 'none';
                updateAgentSelect();
                showToast(`✅ Вход выполнен: ${id}`, 'success'); } else { document.getElementById('staffError').style
                    .display = 'block'; } }

        function staffLogout() { currentUser = null;
            localStorage.removeItem('eGeniusStaff');
            staffInfo.classList.add('hidden');
            staffLogoutBtn.style.display = 'none';
            document.getElementById('staffLoginBtn').style.display = 'block';
            updateAgentSelect();
            showToast('Выход выполнен', 'success'); }

        function autoResizeTextarea() { messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px'; }

        function initApp() { setTimeout(() => { nativeSplash.style.display = 'none';
                loadingScreen.style.display = 'flex';
                (async () => { const dbOk = await loadDatabase(); if (!dbOk || databaseLoadFailed) return; const fontOk =
                        await loadFont(); if (!fontOk) { showErrorBlock(
                            'Нет интернета или задержка с подключением к серверу — пожалуйста, попробуйте зайти сюда позже или проверьте обновления в официальном магазине приложений RuStore.'
                            ); return; } const mediaOk = await loadMedia(); if (!mediaOk) { showErrorBlock(
                            'Нет интернета или задержка с подключением к серверу — пожалуйста, попробуйте зайти сюда позже или проверьте обновления в официальном магазине приложений RuStore.'
                            ); return; }
                    initAudio();
                    loadSettings();
                    loadChat();
                    populateThemes();
                    updateAgentSelect(); const savedStaff = localStorage.getItem('eGeniusStaff'); if (savedStaff) { try {
                            currentUser = JSON.parse(savedStaff); if (config.staffUsers.includes(currentUser
                                .id)) { staffInfo.classList.remove('hidden');
                                staffInfo.innerHTML =
                                `🔐 Персонал: ${currentUser.id}`;
                                staffLogoutBtn.style.display = 'block';
                                document.getElementById('staffLoginBtn').style.display =
                                    'none';
                                updateAgentSelect(); } else staffLogout(); } catch (e) {} }
                    loadingScreen.style.display = 'none';
                    mainScreen.style.display = 'flex';
                    scrollToBottom();
                    requestWakeLock();
                    document.addEventListener('visibilitychange', () => { if (document.visibilityState ===
                            'visible') requestWakeLock(); });
                    document.body.addEventListener('click', enableAudio, { once: true });
                    document.body.addEventListener('touchstart', enableAudio, { once: true }); })(); }, 3000); }

        messageInput.addEventListener('input', autoResizeTextarea);
        messageInput.addEventListener('focus', () => setTimeout(() => messageInput.scrollIntoView({ behavior: 'smooth',
            block: 'center' }), 300));
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                sendMessage(); } else { playTypingSound(); } });
        messageInput.addEventListener('keydown', (e) => { if (e.key !== 'Enter' || e.shiftKey) { playTypingSound(); } });
        sendBtn.onclick = () => { playTapSound(); if (!isWaitingForAI) sendMessage(); };
        document.getElementById('settingsBtn').onclick = () => { playTapSound();
            settingsModal.style.display = 'flex'; };
        document.getElementById('closeSettingsBtn').onclick = () => { playTapSound();
            settingsModal.style.display = 'none'; };
        document.getElementById('resetBtn').onclick = () => { playTapSound();
            resetToDefault(); };
        document.getElementById('clearChatBtn').onclick = () => { playTapSound();
            clearChat(); };
        document.getElementById('privacyBtn').onclick = () => { playTapSound();
            openPrivacy(); };
        document.getElementById('closePrivacyBtn').onclick = () => { playTapSound();
            document.getElementById('privacyModal').style.display = 'none'; };
        document.getElementById('staffLoginBtn').onclick = () => { playTapSound();
            document.getElementById('staffLoginModal').style.display = 'flex'; };
        document.getElementById('staffLogoutBtn').onclick = () => { playTapSound();
            staffLogout(); };
        document.getElementById('confirmStaffBtn').onclick = () => { playTapSound();
            staffLogin(); };
        document.getElementById('cancelStaffBtn').onclick = () => { playTapSound();
            document.getElementById('staffLoginModal').style.display = 'none'; };
        themeSelect.onchange = (e) => { currentTheme = e.target.value;
            applyTheme(currentTheme);
            saveSettings(); };
        agentSelect.onchange = (e) => { if (currentUser?.type !== 'staff') { selectedAgentIndex = parseInt(e.target.value);
                saveSettings(); } };
        allSoundsToggle.onchange = (e) => { allSoundsEnabled = !e.target.checked;
            saveSettings(); };
        volumeSlider.oninput = (e) => { currentVolume = parseInt(e.target.value);
            volumeVal.innerText = currentVolume;
            updateVolume();
            saveSettings(); };
        contextSlider.oninput = (e) => { contextCount = parseInt(e.target.value);
            contextVal.innerText = contextCount;
            saveSettings(); };
        fontSlider.oninput = (e) => { currentFontSize = e.target.value;
            fontSizeVal.innerText = currentFontSize;
            document.documentElement.style.setProperty('--chat-font-size', currentFontSize + 'px');
            saveSettings(); };
        adminToggleBtn.onclick = () => { playTapSound();
            toggleAdminMode(); };
        window.onclick = (e) => { if (e.target === settingsModal) settingsModal.style.display = 'none'; if (e.target ===
                document.getElementById('privacyModal')) document.getElementById('privacyModal').style.display = 'none'; if (
                e.target === document.getElementById('staffLoginModal')) document.getElementById('staffLoginModal').style
                .display = 'none'; };
        initApp();
    </script>
</body>
